stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: react-image

build:
  stage: build
  tags:
    - frontend
  script:
    - docker build -t $DOCKER_IMAGE .
  only:
    - dev

deploy:
  stage: deploy
  tags:
    - frontend
  script:
    - docker rm -f react-app || true
    - docker run -d \
      -p 80:80 \
      -p 443:443 \
      -v /etc/letsencrypt:/etc/letsencrypt \
      --name react-app $DOCKER_IMAGE
  only:
    - dev
